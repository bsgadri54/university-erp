<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Approval | University ERP</title>

    <!-- Leave Approval CSS -->
    <link rel="stylesheet" href="css/leave-approval.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="header-content">

            <h1>
                <i class="fas fa-calendar-check"></i>
                Leave Approval
            </h1>

            <p>For approve leave of employee</p>

        </div>

    </header>


    <!-- =====================================================
         UPDATE LEAVE APPLICATION
    ====================================================== -->

    <section class="card">

        <h2>
            <i class="fas fa-edit"></i>
            Update Leave Application
        </h2>


        <form id="leaveForm">

            <!-- Hidden Leave ID -->
            <input type="hidden" id="leaveId">


            <div class="form-grid">

                <!-- Employee ID -->
                <div class="form-group">

                    <label for="personId">
                        Employee ID
                    </label>

                    <input
                            type="text"
                            id="personId"
                            readonly>

                </div>


                <!-- Employee Name -->
                <div class="form-group">

                    <label for="personName">
                        Employee Name
                    </label>

                    <input
                            type="text"
                            id="personName"
                            readonly>

                </div>


                <!-- Leave Type -->
                <div class="form-group">

                    <label for="leaveType">
                        Leave Type
                    </label>

                    <input
                            type="text"
                            id="leaveType"
                            readonly>

                </div>


                <!-- From Date -->
                <div class="form-group">

                    <label for="fromDate">
                        From Date
                    </label>

                    <input
                            type="text"
                            id="fromDate"
                            readonly>

                </div>


                <!-- To Date -->
                <div class="form-group">

                    <label for="toDate">
                        To Date
                    </label>

                    <input
                            type="text"
                            id="toDate"
                            readonly>

                </div>


                <!-- Total Days -->
                <div class="form-group">

                    <label for="totalDays">
                        Total Days
                    </label>

                    <input
                            type="number"
                            id="totalDays"
                            readonly>

                </div>


                <!-- Status -->
                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="PENDING">
                            Pending
                        </option>

                        <option value="APPROVED">
                            Approved
                        </option>

                        <option value="REJECTED">
                            Rejected
                        </option>

                    </select>

                </div>


                <!-- Remarks -->
                <div class="form-group full-width">

                    <label for="remarks">
                        Remarks
                    </label>

                    <textarea
                            id="remarks"
                            rows="4"
                            placeholder="Enter remarks..."></textarea>

                </div>

            </div>


            <!-- Buttons -->
            <div class="button-group">

                <button
                        type="button"
                        class="save-btn"
                        onclick="updateLeave()">

                    <i class="fas fa-save"></i>
                    Update Leave

                </button>


                <button
                        type="reset"
                        class="clear-btn">

                    <i class="fas fa-eraser"></i>
                    Clear

                </button>

            </div>

        </form>

    </section>


    <!-- =====================================================
         LEAVE APPLICATIONS
    ====================================================== -->

    <section class="card">

        <h2>

            <i class="fas fa-list"></i>
            Leave Applications

        </h2>


        <!-- Search -->
        <input
                type="text"
                id="searchLeave"
                placeholder="Search Employee ID / Name / Status"
                autocomplete="off">


        <!-- Responsive Table Wrapper -->
        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Leave Type</th>
                    <th>From Date</th>
                    <th>To Date</th>
                    <th>Total Days</th>
                    <th>Reason</th>
                    <th>Applied Date</th>
                    <th>Approval Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="leaveTableBody">

                <!-- Data loaded by JavaScript -->

                </tbody>

            </table>

        </div>

    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="page-footer">

        © 2026 University ERP System |
        Designed &amp; Developed by
        <strong>Suresh Gadri</strong>

    </footer>

</div>


<!-- =====================================================
     SWEET ALERT
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- =====================================================
     LEAVE APPROVAL JAVASCRIPT
====================================================== -->

<script src="js/leave-approval.js"></script>

</body>

</html>
