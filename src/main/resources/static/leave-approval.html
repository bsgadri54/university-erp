<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Approval | University ERP</title>

    <link rel="stylesheet" href="css/leave-approval.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>

            <i class="fas fa-calendar-check"></i>

            Leave Approval

        </h1>

        <p>University ERP Admin Module</p>

    </div>

    <!-- ==========================================
         Update Leave
    ========================================== -->

    <div class="card">

        <h2>
            <i class="fas fa-edit"></i>
            Update Leave Application
        </h2>

        <form id="leaveForm">

            <input type="hidden" id="leaveId">

            <div class="form-grid">

                <div class="form-group">

                    <label>Employee ID</label>

                    <input
                            type="text"
                            id="personId"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Employee Name</label>

                    <input
                            type="text"
                            id="personName"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Leave Type</label>

                    <input
                            type="text"
                            id="leaveType"
                            readonly>

                </div>

                <div class="form-group">

                    <label>From Date</label>

                    <input
                            type="text"
                            id="fromDate"
                            readonly>

                </div>

                <div class="form-group">

                    <label>To Date</label>

                    <input
                            type="text"
                            id="toDate"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Total Days</label>

                    <input
                            type="number"
                            id="totalDays"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select id="status">

                        <option value="PENDING">Pending</option>

                        <option value="APPROVED">Approved</option>

                        <option value="REJECTED">Rejected</option>

                    </select>

                </div>

                <div class="form-group full-width">

                    <label>Remarks</label>

                    <textarea
                            id="remarks"
                            rows="4"
                            placeholder="Enter remarks..."></textarea>

                </div>

            </div>

            <div class="button-group">

                <button
                        type="button"
                        class="save-btn"
                        onclick="updateLeave()">

                    <i class="fas fa-save"></i>

                    Update Leave

                </button>

                <button
                        type="reset"
                        class="clear-btn">

                    <i class="fas fa-eraser"></i>

                    Clear

                </button>

            </div>

        </form>

    </div>

    <!-- Leave Requests -->

    <div class="card">

        <h2>

            <i class="fas fa-list"></i>

            Leave Applications

        </h2>

        <input
                type="text"
                id="searchLeave"
                placeholder="Search Employee ID / Name / Status">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Employee ID</th>

                <th>Employee Name</th>

                <th>Leave Type</th>

                <th>From Date</th>

                <th>To Date</th>

                <th>Total Days</th>

                <th>Reason</th>

                <th>Applied Date</th>

                <th>Approval Date</th>

                <th>Status</th>

                <th>Remarks</th>

                <th>Action</th>

            </tr>

            </thead>

            <tbody id="leaveTableBody">

            </tbody>

        </table>

    </div>

    <div class="back-btn">

        <a href="dashboard.html">

            ← Back to Dashboard

        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/leave-approval.js"></script>

</body>

</html>
