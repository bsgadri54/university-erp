<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Result Management | University ERP</title>

    <link rel="stylesheet"
          href="css/result-management.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>
            <i class="fas fa-graduation-cap"></i>
            Result Management
        </h1>

        <p>University ERP Examination Module</p>

    </div>

    <!-- Add / Update Result -->

    <div class="card">

        <h2>
            <i class="fas fa-edit"></i>
            Update Marks
        </h2>

        <form id="resultForm">

            <input type="hidden" id="resultId">

            <div class="form-grid">

                <div class="form-group">

                    <label>Enrollment Number</label>

                    <input
                            type="text"
                            id="enrollmentNo"
                            placeholder="Enter Enrollment Number">

                </div>

                <div class="form-group">

                    <label>Student Name</label>

                    <input
                            type="text"
                            id="studentName"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Course</label>

                    <input
                            type="text"
                            id="course"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Subject</label>

                    <select id="subject">

                        <option value="">
                            Select Subject
                        </option>

                        <option>Computer Network</option>
                        <option>Data Base Management System</option>
                        <option>Software Engineering</option>
                        <option>Java Programming</option>
                        <option>Web Technology</option>
                        <option>Java Programming LAB</option>
                        <option>Data Base Management System LAB</option>
                        <option>Web Technology LAB</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Semester</label>

                    <select id="semester">

                        <option value="SEM 1">SEM 1</option>

                    </select>

                    </select>

                </div>

                <div class="form-group">

                    <label>Maximum Marks</label>

                    <input
                            type="number"
                            id="maxMarks"
                            value="100"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Marks Obtained</label>

                    <input
                            type="number"
                            id="marks">

                </div>

                <div class="form-group">

                    <label>Percentage</label>

                    <input
                            type="text"
                            id="percentage"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Grade</label>

                    <input
                            type="text"
                            id="grade"
                            readonly>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <input
                            type="text"
                            id="status"
                            readonly>

                </div>

            </div>

            <div class="button-group">

                <button
                        type="submit"
                        class="save-btn">

                    <i class="fas fa-save"></i>

                    Save Result

                </button>

                <button
                        type="reset"
                        class="clear-btn">

                    <i class="fas fa-eraser"></i>

                    Clear

                </button>

            </div>

        </form>

    </div>

    <!-- Result Records -->

    <div class="card">

        <h2>

            <i class="fas fa-table"></i>

            Result Records

        </h2>

        <input
                type="text"
                id="search"
                placeholder="Search by Enrollment Number...">

        <div class="table-responsive">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Enrollment No</th>

                    <th>Student Name</th>

                    <th>Subject</th>

                    <th>Marks</th>

                    <th>Maximum</th>

                    <th>Percentage</th>

                    <th>Grade</th>

                    <th>Status</th>

                    <th>Semester</th>

                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="resultTable">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Back Button -->

    <div class="back-btn">

        <button
                onclick="window.location.href='dashboard.html'">

            ← Back To Dashboard

        </button>

    </div>

    <!-- Footer -->

    <footer>

        © 2026 University ERP System |
        Designed & Developed by
        <strong>Suresh Gadri</strong>

    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/alerts.js"></script>

<script src="js/result-management.js"></script>

</body>

</html>
