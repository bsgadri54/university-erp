<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Apply | University ERP</title>

    <link rel="stylesheet" href="css/leave-apply.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="page-container">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <a href="employee-dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="header-content">

            <h1>
                <i class="fas fa-calendar-check"></i>
                Leave Application
            </h1>

            <p>Apply for leave and view your leave history</p>

        </div>

    </div>


    <!-- ================= APPLY LEAVE ================= -->

    <div class="card">

        <h2>
            <i class="fas fa-edit"></i>
            Apply Leave
        </h2>

        <form id="leaveForm">

            <div class="form-grid">

                <!-- Employee ID -->

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                            type="text"
                            id="employeeId"
                            readonly>

                </div>


                <!-- Employee Name -->

                <div class="form-group">

                    <label for="employeeName">
                        Employee Name
                    </label>

                    <input
                            type="text"
                            id="employeeName"
                            readonly>

                </div>


                <!-- Department -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                            type="text"
                            id="department"
                            readonly>

                </div>


                <!-- Leave Type -->

                <div class="form-group">

                    <label for="leaveType">
                        Leave Type
                    </label>

                    <select id="leaveType">

                        <option value="">
                            Select Leave Type
                        </option>

                        <option value="Casual Leave">
                            Casual Leave
                        </option>

                        <option value="Sick Leave">
                            Sick Leave
                        </option>

                        <option value="Leave Without Pay">
                            Leave Without Pay
                        </option>

                        <option value="Maternity Leave">
                            Maternity Leave
                        </option>

                        <option value="Paternity Leave">
                            Paternity Leave
                        </option>

                    </select>

                </div>


                <!-- From Date -->

                <div class="form-group">

                    <label for="fromDate">
                        From Date
                    </label>

                    <input
                            type="date"
                            id="fromDate">

                </div>


                <!-- To Date -->

                <div class="form-group">

                    <label for="toDate">
                        To Date
                    </label>

                    <input
                            type="date"
                            id="toDate">

                </div>


                <!-- Reason -->

                <div class="form-group full-width">

                    <label for="reason">
                        Reason
                    </label>

                    <textarea
                            id="reason"
                            rows="4"
                            placeholder="Enter leave reason..."></textarea>

                </div>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button
                        type="submit"
                        class="btn-save">

                    <i class="fas fa-paper-plane"></i>
                    Submit Leave

                </button>


                <button
                        type="reset"
                        class="btn-clear">

                    <i class="fas fa-eraser"></i>
                    Clear

                </button>

            </div>

        </form>

    </div>


    <!-- ================= LEAVE HISTORY ================= -->

    <div class="card">

        <h2>
            <i class="fas fa-list"></i>
            My Leave History
        </h2>


        <input
                type="text"
                id="searchLeave"
                placeholder="Search Leave Type / Date / Status / Remarks">


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Leave Type</th>
                    <th>From Date</th>
                    <th>To Date</th>
                    <th>Total Days</th>
                    <th>Applied Date</th>
                    <th>Approval Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="leaveTableBody"></tbody>

            </table>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="page-footer">

        © 2026 University ERP System |
        Designed & Developed by
        <strong>Suresh Gadri</strong>

    </footer>

</div>


<!-- ================= SWEET ALERT ================= -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/leave-apply.js"></script>

</body>

</html>
