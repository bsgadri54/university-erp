<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management | University ERP</title>

    <link rel="stylesheet" href="css/user-management.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <h1>
            <i class="fa-solid fa-users"></i>
            User Management
        </h1>

        <p>University ERP User Module</p>

    </div>


    <!-- ================= FORM ================= -->

    <div class="card">

        <h2>Add / Update User</h2>

        <form onsubmit="event.preventDefault(); saveUser();">

            <input type="hidden" id="userId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Username</label>
                    <input
                            type="text"
                            id="username"
                            placeholder="Enter Username"
                            required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input
                            type="email"
                            id="email"
                            placeholder="Enter Email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                            required>
                </div>

                <div class="form-group">
                    <label>Role</label>

                    <select id="role" required>

                        <option value="">Select Role</option>

                        <option>ADMIN</option>

                        <option>DEACTIVATED USER</option>

                        <option>EMPLOYEE</option>

                        <option>STUDENT</option>

                    </select>

                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="btn btn-save">

                    Save User

                </button>

                <button
                        type="reset"
                        class="btn btn-clear"
                        onclick="clearForm()">

                    Clear

                </button>

            </div>

        </form>

    </div>


    <!-- ================= USER RECORDS ================= -->

    <div class="card">

        <h2>User Records</h2>

        <div class="search-box">

            <input
                    type="text"
                    id="searchUser"
                    placeholder="🔍 Search by Username or Email">

        </div>

        <div class="table-responsive">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Username</th>

                    <th>Email</th>

                    <th>Role</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="userBody">

                </tbody>

            </table>

        </div>

    </div>


    <!-- ================= BACK BUTTON ================= -->

    <div class="back-section">

        <a href="#" class="back-btn" onclick="goDashboard()">

            ← Back To Dashboard

        </a>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 University ERP System |
        Designed & Developed by
        <strong>Suresh Gadri</strong>

    </footer>

</div>
<script src="js/common.js"></script>
<script src="js/user-management.js"></script>

</body>
</html>
