<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management | University ERP</title>

    <link rel="stylesheet" href="css/student.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <h1>

            <i class="fas fa-graduation-cap"></i>

            Student Management

        </h1>

        <p>University ERP Student Module</p>

    </div>

    <!-- ================= STUDENT FORM ================= -->

    <div class="card">

        <h2>Add / Update Student</h2>

        <form onsubmit="event.preventDefault(); saveStudent();">

            <input type="hidden" id="studentId">

            <div class="form-grid">

                <!-- Enrollment -->

                <div class="form-group">

                    <label>Enrollment Number</label>

                    <input
                            type="text"
                            id="enrollmentNo"
                            placeholder="Enter Enrollment Number"
                            required>

                </div>

                <!-- Student Name -->

                <div class="form-group">

                    <label>Student Name</label>

                    <input
                            type="text"
                            id="studentName"
                            placeholder="Enter Student Name"
                            required>

                </div>

                <!-- Email -->

                <div class="form-group">

                    <label>Email</label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter Email">

                </div>

                <!-- Mobile -->

                <div class="form-group">

                    <label>Mobile Number</label>

                    <input
                            type="text"
                            id="phone"
                            placeholder="Enter Mobile Number">

                </div>

                <!-- Course -->

                <div class="form-group">

                    <label>Course</label>

                    <select id="course">

                        <option value="">Select Course</option>

                        <option>
                            Diploma In Engineering - Computer Science and Engineering
                        </option>
                        <option>B.Tech - Computer Science & Engineering</option>
                        <option>B.Tech - Computer Science & Engineering (Artificial Intelligence)</option>
                        <option>B.Tech - Computer Science & Engineering (Data Science)</option>
                        <option>B.Tech - Information Technology</option>
                        <option>M.Tech - Computer Science & Engineering</option>
                        <option>M.Tech - Computer Science & Engineering (Artificial Intelligence)</option>
                        <option>M.Tech - Computer Science & Engineering (Data Science)</option>
                        <option>M.Tech - Information Technology</option>
                    </select>

                </div>

                <!-- Semester -->

                <div class="form-group">

                    <label>Semester</label>

                    <select id="semester">

                        <option value="">Select Semester</option>

                        <option>SEM 1</option>
                        <option>SEM 2</option>
                        <option>SEM 3</option>
                        <option>SEM 4</option>
                        <option>SEM 5</option>
                        <option>SEM 6</option>
                        <option>SEM 7</option>
                        <option>SEM 8</option>

                    </select>

                </div>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button
                        type="submit"
                        class="btn btn-save">

                    <i class="save"></i>

                    Save Student

                </button>

                <button
                        type="reset"
                        class="btn btn-clear"
                        onclick="clearForm()">

                    Clear

                </button>

            </div>

        </form>


    </div>
    <!-- ================= STUDENT RECORDS ================= -->

    <div class="card">

        <h2>Student Records</h2>

        <div class="search-box">

            <input
                    type="text"
                    id="searchStudent"
                    placeholder="🔍 Search by Enrollment No or Student Name"
                    onkeyup="searchStudent()">

        </div>

        <div class="table-responsive">

            <table>

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Enrollment No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="studentBody">

                </tbody>

            </table>

        </div>

    </div>

    <!-- ================= BACK BUTTON ================= -->

    <div class="back-section">

        <a href="#" class="back-btn" onclick="goDashboard()">

            ← Back To Dashboard

        </a>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 University ERP System |
        Designed & Developed by <strong>Suresh Gadri</strong>

    </footer>

</div>

<script src="js/common.js"></script>
<script src="js/student.js"></script>

</body>
</html>
