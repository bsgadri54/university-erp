<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .container{
            width:95%;
            max-width:1400px;
            margin:30px auto;
        }

        .header{
            background:linear-gradient(135deg,#1565c0,#42a5f5);
            color:white;
            text-align:center;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
            margin-bottom:25px;
        }

        .header h1{
            font-size:40px;
            margin-bottom:10px;
        }

        .header p{
            font-size:18px;
        }

        .card{

            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
            margin-bottom:25px;

        }

        .card h2{

            color:#1565c0;
            margin-bottom:25px;

        }

        .form-grid{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:18px;

        }

        .form-group{

            display:flex;
            flex-direction:column;

        }

        .form-group label{

            margin-bottom:8px;
            font-weight:600;
            color:#333;

        }

        .form-group input,
        .form-group select{

            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;

        }

        .form-group input:focus,
        .form-group select:focus{

            outline:none;
            border-color:#1565c0;

        }

        .button-group{

            margin-top:25px;
            display:flex;
            gap:15px;
            flex-wrap:wrap;

        }

        button{

            padding:12px 30px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
            font-weight:bold;

        }

        .save-btn{

            background:#2e7d32;
            color:white;

        }

        .save-btn:hover{

            background:#1b5e20;

        }

        .clear-btn{

            background:#ef6c00;
            color:white;

        }

        .clear-btn:hover{

            background:#e65100;

        }

        .back-btn{

            background:#1565c0;
            color:white;

        }

        .back-btn:hover{

            background:#0d47a1;

        }

        .search-box{

            margin-bottom:20px;

        }

        .search-box input{

            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;

        }

        .table-container{

            overflow-x:auto;

        }

        table{

            width:100%;
            border-collapse:collapse;

        }

        thead{

            background:#1565c0;
            color:white;

        }

        th{

            padding:15px;

        }

        td{

            padding:12px;
            text-align:center;
            border-bottom:1px solid #eee;

        }

        tbody tr:hover{

            background:#f5f9ff;

        }

        .edit-btn{

            background:#2e7d32;
            color:white;
            padding:8px 15px;
            border:none;
            border-radius:6px;
            cursor:pointer;

        }

        .delete-btn{

            background:#d32f2f;
            color:white;
            padding:8px 15px;
            border:none;
            border-radius:6px;
            cursor:pointer;

        }

        .footer{

            text-align:center;
            margin-top:30px;
            color:#777;
            font-size:14px;

        }

        @media(max-width:768px){

            .header h1{

                font-size:28px;

            }

            .form-grid{

                grid-template-columns:1fr;

            }

            button{

                width:100%;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎓 Student Management</h1>

        <p>University ERP Student Module</p>

    </div>

    <div class="card">

        <h2>Add / Update Student</h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Enrollment Number</label>

                <input
                        type="text"
                        id="enrollmentNo"
                        placeholder="Enter Enrollment Number">

            </div>

            <div class="form-group">

                <label>Student Name</label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter Student Name">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter Email">

            </div>

            <div class="form-group">

                <label>Mobile Number</label>

                <input
                        type="text"
                        id="phone"
                        placeholder="Enter Mobile Number">

            </div>

            <div class="form-group">

                <label>Course</label>

                <select id="course">

                    <option value="">Select Course</option>

                    <option>Diploma Computer Science Engineering</option>

                    <option>Diploma Mechanical Engineering</option>

                    <option>Diploma Civil Engineering</option>

                    <option>Diploma Electrical Engineering</option>

                </select>

            </div>

            <div class="form-group">

                <label>Semester</label>

                <select id="semester">

                    <option value="">Select Semester</option>

                    <option>SEM 1</option>
                    <option>SEM 2</option>
                    <option>SEM 3</option>
                    <option>SEM 4</option>
                    <option>SEM 5</option>
                    <option>SEM 6</option>

                </select>

            </div>

        </div>

        <div class="button-group">

            <button
                    class="save-btn"
                    onclick="saveStudent()">

                Save Student

            </button>

            <button
                    class="clear-btn"
                    onclick="clearForm()">

                Clear

            </button>

        </div>

    </div>
    <!-- Student List -->

    <div class="card">

        <h2>Student Records</h2>

        <div class="search-box">

            <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search by Enrollment No or Student Name"
                    onkeyup="loadStudents()">

        </div>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Enrollment No</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Mobile</th>

                    <th>Course</th>

                    <th>Semester</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

    <div class="button-group">

        <button
                class="back-btn"
                onclick="goDashboard()">

            ⬅ Back To Dashboard

        </button>

    </div>

    <div class="footer">

        © 2026 University ERP System |
        Designed & Developed by
        <strong>Suresh Gadri</strong>

    </div>

</div>

<script>

    let editId = null;

    window.onload = function(){

        loadStudents();

    };

    function loadStudents(){

        let keyword =
            document.getElementById("search")
                .value
                .toLowerCase();

        fetch("https://university-erp-1-gac1.onrender.com/students")

            .then(response => response.json())

            .then(data => {

                let rows = "";

                data.forEach(student=>{

                    if(

                        keyword !== "" &&

                        !student.enrollmentNo
                            .toLowerCase()
                            .includes(keyword)

                        &&

                        !student.name
                            .toLowerCase()
                            .includes(keyword)

                    ){
                        return;
                    }

                    rows += `

                <tr>

                    <td>${student.id}</td>

                    <td>${student.enrollmentNo}</td>

                    <td>${student.name}</td>

                    <td>${student.email}</td>

                    <td>${student.phone}</td>

                    <td>${student.course}</td>

                    <td>${student.semester}</td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editStudent(${student.id})">

                            Edit

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">

                            Delete

                        </button>

                    </td>

                </tr>

                `;

                });

                document.getElementById("studentTable").innerHTML = rows;

            });

    }

    function saveStudent(){

        let student={

            enrollmentNo:
                document.getElementById("enrollmentNo").value.trim(),

            name:
                document.getElementById("name").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            course:
            document.getElementById("course").value,

            semester:
            document.getElementById("semester").value

        };

        if(

            student.enrollmentNo==="" ||

            student.name==="" ||

            student.email==="" ||

            student.phone==="" ||

            student.course==="" ||

            student.semester===""

        ){

            alert("Please fill all fields.");

            return;

        }

        let url =
            "https://university-erp-1-gac1.onrender.com/students";

        let method = "POST";

        if(editId != null){

            url += "/" + editId;

            method = "PUT";
        }

        fetch(url,{

            method:method,

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(student)

        })

            .then(response=>{

                if(!response.ok){

                    throw new Error("Unable to save student.");

                }

                return response.json();

            })

            .then(data=>{

                alert(

                    editId==null ?

                        "Student Saved Successfully"

                        :

                        "Student Updated Successfully"

                );

                clearForm();

                loadStudents();

            })

            .catch(error=>{

                console.error(error);

                alert("Save Failed.");

            });

    }

    function editStudent(id){

        fetch("https://university-erp-1-gac1.onrender.com/students/"+id)

            .then(response=>response.json())

            .then(student=>{

                editId=id;

                document.getElementById("enrollmentNo").value=
                    student.enrollmentNo;

                document.getElementById("name").value=
                    student.name;

                document.getElementById("email").value=
                    student.email;

                document.getElementById("phone").value=
                    student.phone;

                document.getElementById("course").value=
                    student.course;

                document.getElementById("semester").value=
                    student.semester;

                window.scrollTo({

                    top:0,

                    behavior:"smooth"

                });

            });

    }

    function clearForm(){

        editId=null;

        document.getElementById("enrollmentNo").value="";

        document.getElementById("name").value="";

        document.getElementById("email").value="";

        document.getElementById("phone").value="";

        document.getElementById("course").selectedIndex=0;

        document.getElementById("semester").selectedIndex=0;

    }

    function deleteStudent(id){

        if(!confirm("Are you sure you want to delete this student?")){
            return;
        }

        fetch("https://university-erp-1-gac1.onrender.com/students/" + id,{

            method:"DELETE"

        })

            .then(response=>{

                if(!response.ok){
                    throw new Error("Delete Failed");
                }

                return response.text();

            })

            .then(message=>{

                alert(message);

                loadStudents();

            })

            .catch(error=>{

                console.error(error);

                alert("Unable to delete student.");

            });

    }

    function goDashboard(){

        let role = localStorage.getItem("role");

        if(role === "ADMIN"){

            window.location.href = "dashboard.html";

        }
        else if(role === "EMPLOYEE"){

            window.location.href = "employee-dashboard.html";

        }
        else{

            window.location.href = "login.html";

        }

    }

</script>

</body>
</html>
