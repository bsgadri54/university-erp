<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | University ERP</title>

    <link rel="stylesheet" href="css/profile.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body onload="loadProfile()">

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <h1>

            <i class="fa-solid fa-user-circle"></i>

            My Profile

        </h1>

        <p>University ERP User Profile</p>

    </div>

    <!-- ================= PROFILE CARD ================= -->

    <div class="card">

        <h2>

            <i class="fa-solid fa-address-card"></i>

            Profile Information

        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Username</label>

                <input
                        type="text"
                        id="username"
                        readonly>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        id="email"
                        readonly>

            </div>

            <div class="form-group">

                <label>Role</label>

                <input
                        type="text"
                        id="role"
                        readonly>

            </div>

        </div>

    </div>

    <!-- ================= CHANGE PASSWORD ================= -->

    <div class="card">

        <h2>

            <i class="fa-solid fa-lock"></i>

            Change Password

        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>New Password</label>

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter New Password">

            </div>

        </div>

        <div class="button-group">

            <button
                    class="btn btn-save"
                    onclick="changePassword()">

                <i class="fa-solid fa-key"></i>

                Update Password

            </button>

            <button
                    class="btn btn-clear"
                    onclick="clearPassword()">

                <i class="fa-solid fa-eraser"></i>

                Clear

            </button>

        </div>

    </div>
    <!-- ================= BACK BUTTON ================= -->

    <div class="back-section">

        <a href="#" class="back-btn" onclick="goDashboard()">

            ← Back To Dashboard

        </a>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 University ERP System |
        Designed & Developed by
        <strong>Suresh Gadri</strong>

    </footer>

</div>

<!-- ================= JAVASCRIPT ================= -->
<script src="js/common.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
