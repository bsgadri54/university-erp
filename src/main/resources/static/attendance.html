<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Management | University ERP</title>

    <link rel="stylesheet" href="css/attendance.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body onload="loadAttendance()">

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <h1>

            <i class="fa-solid fa-calendar-check"></i>

            Attendance Management

        </h1>

        <p>University ERP Attendance Module</p>

    </div>

    <!-- ================= TAKE ATTENDANCE ================= -->

    <div class="card">

        <h2>

            <i class="fa-solid fa-user-check"></i>

            Take Attendance

        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Attendance Type</label>

                <select id="type" onchange="loadNames()">

                    <option value="STUDENT">Student</option>

                    <option value="EMPLOYEE">Employee</option>

                </select>

            </div>

            <div class="form-group">

                <label>Name</label>

                <select id="name">

                    <option value="">Select Name</option>

                </select>

            </div>

            <div class="form-group">

                <label>Date</label>

                <input
                        type="date"
                        id="date">

            </div>

            <div class="form-group">

                <label>Status</label>

                <select id="status">

                    <option value="PRESENT">Present</option>

                    <option value="ABSENT">Absent</option>

                </select>

            </div>

        </div>

        <div class="button-group">

            <button
                    class="btn btn-save"
                    onclick="saveAttendance()">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Attendance

            </button>

            <button
                    class="btn btn-clear"
                    onclick="clearForm()">

                <i class="fa-solid fa-eraser"></i>

                Clear

            </button>

        </div>

    </div>
    <!-- ================= ATTENDANCE RECORDS ================= -->

    <div class="card">

        <h2>

            <i class="fa-solid fa-table"></i>

            Attendance Records

        </h2>

        <div class="search-box">

            <input
                    type="text"
                    id="searchAttendance"
                    placeholder="🔍 Search by Name or Type"
                    onkeyup="searchAttendance()">

        </div>

        <div class="table-responsive">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Type</th>

                    <th>Name</th>

                    <th>Date</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="attendanceTable">

                <!-- JavaScript loads attendance records -->

                </tbody>

            </table>

        </div>

    </div>


    <!-- ================= BACK BUTTON ================= -->

    <div class="back-section">

        <button
                class="back-btn"
                onclick="goDashboard()">

            <i class="fa-solid fa-arrow-left"></i>

            Back To Dashboard

        </button>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 University ERP System |
        Designed & Developed by
        <strong>Suresh Gadri</strong>

    </footer>

</div>


<!-- Common JS -->
<script src="js/common.js"></script>

<!-- Attendance JS -->
<script src="js/attendance.js"></script>

</body>
</html>
