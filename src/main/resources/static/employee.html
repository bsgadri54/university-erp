<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management | University ERP</title>

    <link rel="stylesheet" href="css/employee.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <h1>
            <i class="fa-solid fa-user-tie"></i>
            Employee Management
        </h1>

        <p>University ERP Employee Module</p>

    </div>


    <!-- ================= FORM CARD ================= -->

    <div class="card">

        <h2>Add / Update Employee</h2>

        <form onsubmit="event.preventDefault(); saveEmployee();">

            <input type="hidden" id="employeeId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Employee Code</label>
                    <input type="text" id="employeeCode" placeholder="Enter Employee Code" required>
                </div>

                <div class="form-group">
                    <label>Employee Name</label>
                    <input type="text" id="employeeName" placeholder="Enter Employee Name" required>
                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter Email">

                </div>

                <div class="form-group">

                    <label>Mobile Number</label>

                    <input
                            type="text"
                            id="mobile"
                            placeholder="Enter Mobile Number">

                </div>

                <div class="form-group">
                    <label>Designation</label>

                    <select id="designation">

                        <option value="">Select Designation</option>
                        <option>Vice Chancellor</option>
                        <option>Registrar</option>
                        <option>Head of Department (HOD)</option>
                        <option>Professor</option>
                        <option>Associate Professor</option>
                        <option>Assistant Professor</option>
                        <option>Lecturer</option>
                        <option>Teaching Assistant</option>
                        <option>Lab Assistant</option>
                        <option>Accountant</option>
                        <option>HR Manager</option>
                        <option>HR Executive</option>
                        <option>Admission Coordinator</option>
                        <option>Controller of Examinations</option>
                        <option>ERP Administrator</option>
                        <option>Office Assistant</option>
                        <option>Senior System Engineer</option>
                        <option>Network Engineer</option>
                        <option>Accountant</option>
                        <option>Training & Placement Coordinator</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Department</label>

                    <select id="department">

                        <option value="">Select Department</option>
                        <option>Administration</option>
                        <option>Admissions</option>
                        <option>IT Support</option>
                        <option>Networking</option>
                        <option>Finance & Accounts</option>
                        <option>Training & Placement</option>
                        <option>ERP Development</option>
                        <option>Examination Cell</option>
                        <option>Human Resources</option>
                        <option>Computer Science & Engineering</option>
                    </select>

                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="btn btn-save">
                    Save Employee
                </button>

                <button type="reset" class="btn btn-clear" onclick="clearForm()">
                    Clear
                </button>

            </div>

        </form>
    </div>


    <!-- ================= RECORDS ================= -->

    <div class="card">

        <h2>Employee Records</h2>

        <div class="search-box">

            <input
                    type="text"
                    id="searchEmployee"
                    placeholder="🔍 Search by Employee Code or Employee Name">

        </div>

        <div class="table-responsive">

            <table>

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Employee Code</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="employeeBody">

                </tbody>

            </table>

        </div>

    </div>


    <!-- ================= BACK BUTTON ================= -->

    <div class="back-section">

        <a href="#" class="back-btn" onclick="goDashboard()">

            ← Back To Dashboard

        </a>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 University ERP System |
        Designed & Developed by <strong>Suresh Gadri</strong>

    </footer>

</div>

<script src="js/common.js"></script>
<script src="js/employee.js"></script>

</body>
</html>
